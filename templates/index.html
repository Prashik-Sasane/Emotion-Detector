<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>

<body>

    <h1>Emotion Detector</h1>

    <label for="textToAnalyze">Enter text:</label>
    <br><br>

    <textarea
        id="textToAnalyze"
        rows="5"
        cols="50"
        placeholder="Enter a sentence to analyze..."
    ></textarea>

    <br><br>

    <button onclick="RunSentimentAnalysis()">
        Analyze Emotion
    </button>

    <br><br>

    <div id="system_response"></div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>

</body>
</html>
